stages:
  - build

build-reporterd:
  stage: build
  image: golang:1.23
  variables:
    GOOS: linux
    GOARCH: amd64
  script:
    - go build -o reporterd ./cmd
    - tar czf reporterd_Linux_x86_64.tar.gz reporterd
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file reporterd_Linux_x86_64.tar.gz \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/reporterd/${CI_COMMIT_REF_NAME}/reporterd_Linux_x86_64.tar.gz"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
